name: DCML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-build-and-test:
    name: Core Build & Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore DCML Core
        run: dotnet restore src/DCML.Core/DCML.Core.csproj

      - name: Build DCML Core
        run: dotnet build src/DCML.Core/DCML.Core.csproj --configuration Release --no-restore

      - name: Restore test module
        run: dotnet restore src/DCML.TestModule/DCML.TestModule.csproj

      - name: Build test module
        run: dotnet build src/DCML.TestModule/DCML.TestModule.csproj --configuration Release --no-restore

      - name: Restore multi-module publisher probe
        run: dotnet restore src/DCML.MultiModuleProbe.Publisher/DCML.MultiModuleProbe.Publisher.csproj

      - name: Build multi-module publisher probe
        run: dotnet build src/DCML.MultiModuleProbe.Publisher/DCML.MultiModuleProbe.Publisher.csproj --configuration Release --no-restore

      - name: Restore multi-module consumer probe
        run: dotnet restore src/DCML.MultiModuleProbe.Consumer/DCML.MultiModuleProbe.Consumer.csproj

      - name: Build multi-module consumer probe
        run: dotnet build src/DCML.MultiModuleProbe.Consumer/DCML.MultiModuleProbe.Consumer.csproj --configuration Release --no-restore

      - name: Restore optional provider probe
        run: dotnet restore src/DCML.OptionalProbe.Provider/DCML.OptionalProbe.Provider.csproj

      - name: Build optional provider probe
        run: dotnet build src/DCML.OptionalProbe.Provider/DCML.OptionalProbe.Provider.csproj --configuration Release --no-restore

      - name: Restore optional consumer probe
        run: dotnet restore src/DCML.OptionalProbe.Consumer/DCML.OptionalProbe.Consumer.csproj

      - name: Build optional consumer probe
        run: dotnet build src/DCML.OptionalProbe.Consumer/DCML.OptionalProbe.Consumer.csproj --configuration Release --no-restore

      - name: Restore compatibility rejection probe
        run: dotnet restore src/DCML.CompatibilityProbe.UnsupportedCapability/DCML.CompatibilityProbe.UnsupportedCapability.csproj

      - name: Build compatibility rejection probe
        run: dotnet build src/DCML.CompatibilityProbe.UnsupportedCapability/DCML.CompatibilityProbe.UnsupportedCapability.csproj --configuration Release --no-restore

      - name: Restore minimal loader acceptance probe
        run: dotnet restore src/DCML.LoaderAcceptanceProbe.Minimal/DCML.LoaderAcceptanceProbe.Minimal.csproj

      - name: Build minimal loader acceptance probe
        run: dotnet build src/DCML.LoaderAcceptanceProbe.Minimal/DCML.LoaderAcceptanceProbe.Minimal.csproj --configuration Release --no-restore

      - name: Restore persistence helper
        run: dotnet restore src/DCML.Persistence.Helper/DCML.Persistence.Helper.csproj

      - name: Build persistence helper
        run: dotnet build src/DCML.Persistence.Helper/DCML.Persistence.Helper.csproj --configuration Release --no-restore

      - name: Enforce provider restrictions
        shell: pwsh
        run: ./tools/Test-DCMLProviderRestrictions.ps1

      - name: Restore tests
        run: dotnet restore tests/DCML.Core.Tests/DCML.Core.Tests.csproj

      - name: Run tests
        run: >-
          dotnet test tests/DCML.Core.Tests/DCML.Core.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=dcml-core-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dcml-test-results-${{ github.run_number }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
